<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><title>The Library · Knowledge Graph</title><meta name="library-graph-renderer" content="atlas-3d-v1"><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060a10}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}canvas:focus-visible{outline:2px solid #e7bd84;outline-offset:-3px}</style></head><body>

<script id="library-graph-data" type="application/json">{"schema_version":"public-topology-v1","public_safe":true,"nodes":[],"links":[]}</script><script>
'use strict';
const sourceData=JSON.parse(document.querySelector('#library-graph-data').textContent);
function makeAtlas(data){
 const count=data.nodes.length,k=Math.min(21,count),index=new Map(data.nodes.map((n,i)=>[n.id,i]));
 const adjacency=Array.from({length:count},()=>[]),edges=[];
 for(const row of data.links){const a=index.get(row[0]),b=index.get(row[1]);if(a===undefined||b===undefined||a===b)continue;edges.push([a,b,row[2]!==true]);if(row[2]===true){adjacency[a].push(b);adjacency[b].push(a);}}
 const ranked=Array.from({length:count},(_,i)=>i).sort((a,b)=>adjacency[b].length-adjacency[a].length||a-b),seeds=[],near=new Set();
 for(const i of ranked){if(seeds.length===k)break;if(near.has(i))continue;seeds.push(i);near.add(i);for(const j of adjacency[i]){near.add(j);for(const h of adjacency[j])near.add(h);}}
 for(const i of ranked){if(seeds.length===k)break;if(!seeds.includes(i))seeds.push(i);}
 const assignment=new Int32Array(count).fill(-1),queues=seeds.map(i=>[i]),heads=Array(k).fill(0),sizes=Array(k).fill(1),cap=Math.ceil(count/Math.max(1,k)*1.4);
 seeds.forEach((i,g)=>assignment[i]=g);
 let advancing=true;while(advancing){advancing=false;for(let g=0;g<k;g++){if(heads[g]>=queues[g].length||sizes[g]>=cap)continue;advancing=true;const i=queues[g][heads[g]++];for(const j of adjacency[i]){if(assignment[j]!==-1||sizes[g]>=cap)continue;assignment[j]=g;sizes[g]++;queues[g].push(j);}}}
 for(let i=0;i<count;i++){if(assignment[i]!==-1)continue;let g=0;for(let j=1;j<k;j++)if(sizes[j]<sizes[g])g=j;assignment[i]=g;sizes[g]++;}

const D=makeAtlas(sourceData),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
let width=0,height=0,dpr=1,t=0,last=0,raf=0,running=!reduced.matches,yaw=-.12,pitch=.13,zoom=1,selected=-1,hover=-1,dragged=false;
let camera={x:0,y:0,z:0},goal={x:0,y:0,z:0},targetZoom=1;
const palette=['#9ac9dd','#e4be87','#aca6e4','#88c5bb','#d99e9d','#b0c793'];let seed=134;function random(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}

const members=D.groups.map(()=>[]);D.nodes.forEach((n,i)=>members[n.group].push(i));
// Symmetric, full-volume seed: centre, eight inner corners and twelve outer positions.
// All three principal axes have identical spread; no original 2D layout is retained.
const centres=[{x:0,y:0,z:0}];
for(const x of [-360,360])for(const y of [-360,360])for(const z of [-360,360])centres.push({x,y,z});
for(let axis=0;axis<3;axis++)for(const a of [-720,720])for(const b of [-720,720]){const v=[a,b];v.splice(axis,0,0);centres.push({x:v[0],y:v[1],z:v[2]});}
const ranked=members.map((m,i)=>i).sort((a,b)=>members[b].length-members[a].length);
const groups=D.groups.map((g,i)=>({ ...centres[ranked.indexOf(i)],r:40*Math.cbrt(members[i].length),color:palette[i%palette.length],phase:random()*6.28}));
// Grow the balanced volume with the largest cluster; preserve separation as data grows.
const clusterScale=Math.max(1,Math.max(0,...groups.map(g=>g.r))/262);
for(const g of groups){g.x*=clusterScale;g.y*=clusterScale;g.z*=clusterScale;}
const sceneSize=2750*clusterScale;
const points=new Array(D.nodes.length);
// Best-candidate volume sampling keeps neighbouring points apart, including in the interior.
for(let gi=0;gi<groups.length;gi++){
 const g=groups[gi],placed=[];
 for(const id of members[gi]){
  let best=null,bestDistance=-1;
  for(let candidate=0;candidate<32;candidate++){
   const az=random()*Math.PI*2,z=random()*2-1,r=Math.cbrt(random())*g.r,q=Math.sqrt(1-z*z);
   const p={x:Math.cos(az)*q*r,y:Math.sin(az)*q*r,z:z*r};
   let distance=Infinity;for(const other of placed){const d=(p.x-other.x)**2+(p.y-other.y)**2+(p.z-other.z)**2;if(d<distance)distance=d;}
   if(distance>bestDistance){bestDistance=distance;best=p;}
  }
  placed.push(best);points[id]={...best,g:gi,phase:random()*6.28,size:.7+random()*1.25,color:g.color};
 }
}
const edges=D.edges;const projected=points.map(()=>({x:0,y:0,z:0,s:0}));let projectedGroups=[];
function project(x,y,z){x-=camera.x;y-=camera.y;z-=camera.z;const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);const X=x*cy+z*sy,Z=-x*sy+z*cy,Y=y*cp-Z*sp,depth=y*sp+Z*cp;const perspective=(3200*clusterScale)/(3200*clusterScale+depth);const base=Math.min(width/sceneSize,height/sceneSize)*zoom;return{x:width/2+X*perspective*base,y:height/2+Y*perspective*base,z:depth,s:perspective*base}}
function glow(x,y,r,color,alpha){if(r<.1)return;const gr=ctx.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,color);gr.addColorStop(1,color+'00');ctx.globalAlpha=alpha;ctx.fillStyle=gr;ctx.fillRect(x-r,y-r,r*2,r*2)}
const stars=Array.from({length:90},()=>({x:random(),y:random(),r:random()*.8+.15,a:random()*.25+.08}));
function draw(){ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.fillStyle='#060a10';ctx.fillRect(0,0,width,height);for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#bbcee0';ctx.beginPath();ctx.arc(s.x*width,s.y*height,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
projectedGroups=groups.map(g=>{const drift=running?Math.sin(t*.25+g.phase)*4:Math.sin(t*.25+g.phase)*4;return project(g.x,g.y+drift,g.z)});
const order=groups.map((_,i)=>i).sort((a,b)=>projectedGroups[b].z-projectedGroups[a].z);
for(const i of order){const g=groups[i],p=projectedGroups[i],r=g.r*p.s;let active=selected<0||selected===i;glow(p.x,p.y,r*1.8,g.color,active?.075:.018);ctx.globalAlpha=active?.10:.025;ctx.strokeStyle=g.color;ctx.lineWidth=.6;ctx.beginPath();ctx.ellipse(p.x,p.y,r,r*.97,0,0,Math.PI*2);ctx.stroke();}
for(let i=0;i<points.length;i++){const p=points[i],g=groups[p.g],angle=t*.055+g.phase,ca=Math.cos(angle),sa=Math.sin(angle);const x=p.x*ca+p.z*sa,z=-p.x*sa+p.z*ca;projected[i]=project(g.x+x,g.y+p.y+Math.sin(t*.25+g.phase)*4,g.z+z)}
ctx.globalCompositeOperation='screen';
for(let j=0;j<edges.length;j++){const [a,b,inferred]=edges[j],pa=points[a],pb=points[b],p=projected[a],q=projected[b],inside=pa.g===pb.g;const active=selected>=0&&(pa.g===selected||pb.g===selected);if(!inside&&!active&&j%5!==0)continue;if(selected>=0&&!active)continue;ctx.globalAlpha=inside?(active?.22:.105):(active?.15:.035);if(inferred)ctx.globalAlpha*=.25;ctx.strokeStyle=inside?pa.color:'#a9bfd1';ctx.lineWidth=inside?.55:.7;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();if(running&&j%37===0&&(selected<0||active)){const u=(t*.13+j*.017)%1,x=p.x+(q.x-p.x)*u,y=p.y+(q.y-p.y)*u;glow(x,y,4,'#ffddb1',.35);ctx.globalAlpha=.75;ctx.fillStyle='#fff0d7';ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fill()}}
const sorted=points.map((_,i)=>i).sort((a,b)=>projected[b].z-projected[a].z);
for(const i of sorted){const p=points[i],v=projected[i],g=groups[p.g];if(v.x<-20||v.x>width+20||v.y<-20||v.y>height+20)continue;const active=selected<0||selected===p.g;const pulse=.8+.2*Math.sin(t*.7+p.phase),radius=Math.max(.6,p.size*v.s*1.7);ctx.globalAlpha=(active?.8:.15)*pulse;ctx.fillStyle=p.color;if(i%9===0&&active)glow(v.x,v.y,radius*4,p.color,.19);ctx.globalAlpha=(active?.82:.13)*pulse;ctx.beginPath();ctx.arc(v.x,v.y,radius,0,Math.PI*2);ctx.fill();if(radius>1.2&&active){ctx.globalAlpha=.75;ctx.fillStyle='#f2f7fa';ctx.beginPath();ctx.arc(v.x-radius*.2,v.y-radius*.25,radius*.32,0,Math.PI*2);ctx.fill()}}
if(hover>=0||selected>=0){const i=selected>=0?selected:hover,p=projectedGroups[i],g=groups[i];ctx.globalAlpha=.3;ctx.strokeStyle=g.color;ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,g.r*p.s+8,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
function frame(now){raf=0;if(document.hidden)return;const dt=last?Math.min((now-last)/1000,.05):0;last=now;if(running)t+=dt;let ease=reduced.matches?1:.09;camera.x+=(goal.x-camera.x)*ease;camera.y+=(goal.y-camera.y)*ease;camera.z+=(goal.z-camera.z)*ease;zoom+=(targetZoom-zoom)*ease;draw();let transitioning=Math.abs(zoom-targetZoom)>.001||Math.hypot(camera.x-goal.x,camera.y-goal.y,camera.z-goal.z)>.1;if(running||transitioning)raf=requestAnimationFrame(frame)}

function updateMotion(){render()}
function reset(){selected=-1;hover=-1;goal={x:0,y:0,z:0};targetZoom=1;yaw=-.12;pitch=.13;render()}
function hit(x,y){let best=-1,score=Infinity;projectedGroups.forEach((p,i)=>{let d=Math.hypot(x-p.x,y-p.y),r=groups[i].r*p.s;if(d<Math.max(r,15)&&d/r<score){best=i;score=d/r}});return best}
function focus(i){if(i<0||i===selected){selected=-1;goal={x:0,y:0,z:0};targetZoom=1}else{selected=i;goal={x:groups[i].x,y:groups[i].y,z:groups[i].z};targetZoom=Math.min(4.5,Math.max(1.5,160/groups[i].r))}render()}
const pointers=new Map();let gesture=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});dragged=false;gesture={x:e.clientX,y:e.clientY,yaw,pitch};if(pointers.size===2){const [a,b]=[...pointers.values()];gesture={distance:Math.hypot(a.x-b.x,a.y-b.y),zoom:targetZoom};dragged=true}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)){hover=hit(e.clientX,e.clientY);render();return}pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&gesture?.distance){const [a,b]=[...pointers.values()];targetZoom=Math.min(6,Math.max(.45,gesture.zoom*Math.hypot(a.x-b.x,a.y-b.y)/gesture.distance));dragged=true}else if(pointers.size===1&&gesture?.x!==undefined){const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.hypot(dx,dy)>5)dragged=true;yaw=gesture.yaw+dx*.005;pitch=Math.min(1.35,Math.max(-1.35,gesture.pitch+dy*.005))}render()});
canvas.addEventListener('pointerup',e=>{pointers.delete(e.pointerId);if(!dragged)focus(hit(e.clientX,e.clientY));if(pointers.size===1){const a=[...pointers.values()][0];gesture={x:a.x,y:a.y,yaw,pitch};dragged=true}else gesture=null});canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);gesture=null;dragged=true});canvas.addEventListener('pointerleave',()=>{hover=-1;render()});
canvas.addEventListener('wheel',e=>{e.preventDefault();targetZoom=Math.min(6,Math.max(.45,targetZoom*Math.exp(-e.deltaY*.001)));render()},{passive:false});canvas.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','-','=','Escape',' '].includes(e.key))return;e.preventDefault();if(e.key==='Escape')reset();else if(e.key===' '){running=!running;updateMotion()}else if(e.key==='+'||e.key==='=')targetZoom=Math.min(6,targetZoom*1.2);else if(e.key==='-')targetZoom=Math.max(.45,targetZoom/1.2);else{yaw+=e.key==='ArrowLeft'?-.12:e.key==='ArrowRight'?.12:0;pitch=Math.max(-1.35,Math.min(1.35,pitch+(e.key==='ArrowUp'?-.12:e.key==='ArrowDown'?.12:0)))}render()});
reduced.addEventListener('change',e=>{running=!e.matches;updateMotion()});document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0;last=0}else render()});new ResizeObserver(()=>{width=innerWidth;height=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);render()}).observe(document.body);updateMotion();
</script></body></html>
