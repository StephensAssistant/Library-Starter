name: Refresh Library graph
on:
  workflow_dispatch:
    inputs:
      artifact:
        description: 'Existing native graph path, e.g. Artifacts/ART-0001-library-knowledge-graph.html'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: library-graph-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/requirements-ci.txt
      - name: Rebuild and validate the existing graph
        env:
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          python .github/scripts/build_library_graph.py --refresh-artifact "$ARTIFACT"
          git add -- "$ARTIFACT"
          python .github/scripts/validate_repo_state.py
          if git diff --cached --quiet; then
            echo "Graph unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh Library graph"
          git push origin HEAD:staging
